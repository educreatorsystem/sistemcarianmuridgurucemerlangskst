<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b182d">
<meta name="description" content="Sistem Carian Maklumat Murid Sekolah Kebangsaan Sungai Tiram. Untuk kegunaan dalaman guru.">
<title>Sistem Carian Murid | SK Sungai Tiram</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="./assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Carian Murid">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#091325;color:#f3f7ff}body{overflow:hidden}
#portal{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#091325;display:none}
#portal.active{display:block}
#screen{position:fixed;inset:0;background:radial-gradient(circle at 50% 23%,#283d5f 0,#101e34 42%,#081321 85%);z-index:3;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;transition:opacity .45s ease,visibility .45s ease}
#screen.dismiss{visibility:hidden;opacity:0;pointer-events:none}
.card{width:min(470px,100%);display:flex;align-items:center;flex-direction:column}
.logo-frame{height:160px;width:160px;display:grid;place-items:center;border:1px solid #d6b16a33;background:#f8e9c008;border-radius:31px;box-shadow:0 0 75px #cba56521;flex:none}.logo-frame img{height:92%;width:92%;display:block;object-fit:contain}
h1{font-size:clamp(22px,5vw,29px);font-weight:850;letter-spacing:-.9px;line-height:1.2;margin:25px 0 7px;background:linear-gradient(100deg,#fff4d3,#e3bd7a,#fff2c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{font-size:14px;color:#bac9e1;margin:0;line-height:1.7}.status{font-size:12px;color:#a8bcd6;margin:22px 0 6px;line-height:1.6}
.track{width:180px;height:4px;border-radius:3px;background:#ffffff20;overflow:hidden;margin-top:14px}.bar{width:43%;height:100%;border-radius:4px;background:linear-gradient(90deg,#b98b42,#ffe8b5);animation:loading 1.3s ease-in-out infinite}@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(360%)}}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px;width:100%}.primary,.secondary{min-height:46px;border-radius:12px;padding:12px 17px;font-weight:750;text-decoration:none;font-size:14px;line-height:1.4;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.primary{background:linear-gradient(115deg,#ffedbd,#d7a75b);color:#19243a;border:0;box-shadow:0 9px 23px #b7863836}.secondary{border:1px solid #d9b56b60;background:#b17f2614;color:#f9dfac}.secondary:hover,.primary:hover{filter:brightness(1.1)}
.help{font-size:12px;color:#b0c0d9;line-height:1.8;margin:21px 0 0;max-width:410px}
#quickOpen{position:fixed;bottom:14px;right:14px;z-index:2;color:#ffe1a0;background:#142943;border:1px solid #d6b06f88;border-radius:12px;padding:11px 14px;font-weight:750;text-decoration:none;font-size:12px;box-shadow:0 6px 25px #0005;display:none}#quickOpen.show{display:block}
@media(max-width:600px){.logo-frame{width:138px;height:138px}.actions{flex-direction:column}.primary,.secondary{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<iframe id="portal" title="Sistem Carian Maklumat Murid SK Sungai Tiram" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write"></iframe>
<a id="quickOpen" href="https://script.google.com/macros/s/AKfycby5UJhujNUfQylBXo-slnRuMGB-J24uSIqNQ2CmSHBjD_B7FYx1LTKdhsdqSZSqpxiv/exec" target="_self">Buka laman terus</a>
<div id="screen" role="status" aria-live="polite"><main class="card">
  <div class="logo-frame"><img src="./assets/school-logo.png" alt="Lencana Sekolah Kebangsaan Sungai Tiram" width="145" height="145"></div>
  <h1>Sistem Carian Maklumat Murid</h1>
  <p class="subtitle">Sekolah Kebangsaan Sungai Tiram</p>
  <div class="track" aria-hidden="true"><div class="bar"></div></div>
  <p id="status" class="status">Menghubungkan sistem…</p>
  <div class="actions"><a id="openDirect" class="primary" href="https://script.google.com/macros/s/AKfycby5UJhujNUfQylBXo-slnRuMGB-J24uSIqNQ2CmSHBjD_B7FYx1LTKdhsdqSZSqpxiv/exec" target="_self">Buka Sistem Carian</a><button id="copyLink" class="secondary" type="button">Salin Pautan</button></div>
  <p id="help" class="help" hidden>Jika pelayar dalam WhatsApp atau aplikasi lain gagal membuka sistem, salin pautan dan buka menggunakan Chrome yang telah dikemas kini.</p>
</main></div>
<script>
(function(){
'use strict';
var APP_URL='https://script.google.com/macros/s/AKfycby5UJhujNUfQylBXo-slnRuMGB-J24uSIqNQ2CmSHBjD_B7FYx1LTKdhsdqSZSqpxiv/exec';
var frame=document.getElementById('portal');
var screen=document.getElementById('screen');
var status=document.getElementById('status');
var help=document.getElementById('help');
var mobile=/Android|iPhone|iPad|iPod|Silk|Kindle|Tablet|webOS|SamsungBrowser/i.test(navigator.userAgent||'');
var standalone=(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
var timer;
function notice(text){status.textContent=text;help.hidden=false;}
function ready(){screen.classList.add('dismiss');document.getElementById('quickOpen').classList.add('show');if(timer)clearTimeout(timer);}
if(mobile){
 notice(standalone?'Ketuk butang di bawah untuk membuka sistem dalam pelayar Chrome.':'Membuka sistem terus untuk keserasian Android dan tablet…');
 // Safari / Chrome embedded Google Apps Script frames sometimes blocked by cross-site cookies.
 // For phones/tablets do not embed external authentication: use top-level navigation.
 if(!standalone){timer=setTimeout(function(){window.location.assign(APP_URL);},1100);}
} else {
 frame.classList.add('active');frame.src=APP_URL;
 frame.addEventListener('load',function(){
   // Load can fire even when Google responds with an error page; direct fallback always remains.
   ready();
 });
 timer=setTimeout(function(){notice('Sistem mengambil masa lebih lama. Jika paparan kosong, pilih “Buka Sistem Carian”.');document.getElementById('quickOpen').classList.add('show');},9500);
}
window.addEventListener('message',function(event){
 if(event && event.data && event.data.kind==='skst-portal-ready' && /(^|\.)googleusercontent\.com$|(^|\.)google\.com$/.test((function(){try{return new URL(event.origin).hostname}catch(e){return ''}})()))ready();
});
document.getElementById('copyLink').addEventListener('click',function(){
 function done(){notice('Pautan disalin. Tampal ke Chrome untuk membuka sistem.');}
 if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(APP_URL).then(done,function(){prompt('Salin pautan berikut:',APP_URL);});}
 else {prompt('Salin pautan berikut:',APP_URL);}
});
if('serviceWorker' in navigator && location.protocol==='https:'){
 window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(reg){if(reg.update)reg.update();}).catch(function(){});});
}
})();
</script>
</body>
</html>
